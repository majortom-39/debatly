<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;margin:0;padding:32px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e7e5e4;border-radius:16px;">
      <tr><td style="padding:30px 32px 0;">
